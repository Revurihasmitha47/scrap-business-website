<section class="auth-page">
  <div class="auth-card change-password-card">
    <p class="eyebrow">SECURITY REQUIRED</p>
    <h2>Change your password</h2>
    <p class="subcopy">
      Your Admin provided a temporary password. Choose a new password before
      continuing.
    </p>

    <div class="alert error" *ngIf="error">{{ error }}</div>
    <div class="alert success" *ngIf="message">{{ message }}</div>

    <form (ngSubmit)="save()">
      <label>
        Current password
        <input type="password" name="current" [(ngModel)]="current" required />
      </label>

      <label>
        New password
        <input
          type="password"
          name="next"
          [(ngModel)]="next"
          required
          minlength="8"
        />
      </label>

      <label>
        Confirm new password
        <input
          type="password"
          name="confirm"
          [(ngModel)]="confirm"
          required
          minlength="8"
        />
      </label>

      <button class="primary-button full" [disabled]="saving">
        {{ saving ? "Saving..." : "Change password" }}
      </button>
    </form>
  </div>
</section>
