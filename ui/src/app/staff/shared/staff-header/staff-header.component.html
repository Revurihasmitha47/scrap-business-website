<header class="staff-header">
  <div class="staff-header-user">
    <button
      class="staff-notification-button"
      type="button"
      aria-label="Notifications"
      (click)="goToNotifications()"
    >
      <svg viewBox="0 0 24 24">
        <path
          d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Zm-8 12h4"
        /></svg
      ><i></i>
    </button>
    <button
      class="staff-profile-trigger"
      type="button"
      [attr.aria-expanded]="profileMenu"
      (click)="profileMenu = !profileMenu"
    >
      <span class="staff-avatar">{{ initials }}</span>
      <strong>{{ auth.session?.fullName || "Pickup Staff" }}</strong>
      <small>Pickup Staff</small>
      <svg class="staff-profile-chevron" viewBox="0 0 24 24">
        <path d="m7 10 5 5 5-5" />
      </svg>
    </button>
    <div class="staff-profile-menu" *ngIf="profileMenu">
      <button type="button" (click)="goToProfile()">Profile</button>
      <button type="button" (click)="logout()">Logout</button>
    </div>
  </div>
</header>
