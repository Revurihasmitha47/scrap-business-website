<main class="password-page"><section class="password-card"><p class="eyebrow">SCRAPFLOW</p><h1>Forgot password?</h1><p>Enter your email and we will send a password reset link.</p><form (ngSubmit)="submit()"><label>Email address<input type="email" name="email" [(ngModel)]="email" required /></label><p class="error" *ngIf="error">{{ error }}</p><p class="success" *ngIf="message">{{ message }}</p><button type="submit" [disabled]="loading">{{ loading ? 'Sending...' : 'Send reset link' }}</button></form><a routerLink="/sign-in">Back to sign in</a></section></main>
