<main class="password-page"><section class="password-card"><p class="eyebrow">SCRAPFLOW</p><h1>Reset password</h1><p>Choose a new password for your account.</p><form (ngSubmit)="submit()"><label>New password<div class="password-wrap"><input [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="password" required /><button class="password-toggle" type="button" (click)="showPassword = !showPassword" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'" [title]="showPassword ? 'Hide password' : 'Show password'"><svg *ngIf="!showPassword" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg><svg *ngIf="showPassword" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 6.2A10.7 10.7 0 0 1 12 6c6 0 9.5 6 9.5 6a17 17 0 0 1-3.1 3.8M6.2 6.8C3.8 8.2 2.5 12 2.5 12s3.5 6 9.5 6c1.4 0 2.7-.3 3.8-.8"/></svg></button></div></label><label>Confirm password<div class="password-wrap"><input [type]="showConfirmPassword ? 'text' : 'password'" name="confirm" [(ngModel)]="confirm" required /><button class="password-toggle" type="button" (click)="showConfirmPassword = !showConfirmPassword" [attr.aria-label]="showConfirmPassword ? 'Hide confirm password' : 'Show confirm password'" [title]="showConfirmPassword ? 'Hide password' : 'Show password'"><svg *ngIf="!showConfirmPassword" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg><svg *ngIf="showConfirmPassword" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 6.2A10.7 10.7 0 0 1 12 6c6 0 9.5 6 9.5 6a17 17 0 0 1-3.1 3.8M6.2 6.8C3.8 8.2 2.5 12 2.5 12s3.5 6 9.5 6c1.4 0 2.7-.3 3.8-.8"/></svg></button></div></label><p class="error" *ngIf="error">{{ error }}</p><p class="success" *ngIf="message">{{ message }}</p><button type="submit" [disabled]="loading">{{ loading ? 'Saving...' : 'Reset password' }}</button></form><a routerLink="/sign-in">Back to sign in</a></section></main>
