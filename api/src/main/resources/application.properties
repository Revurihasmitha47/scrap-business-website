spring.application.name=scrapflow-api
server.port=${PORT:8000}
spring.config.import=optional:file:./.env[.properties],optional:file:./api/.env[.properties]
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/scrap_business}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.jdbc.template.query-timeout=5
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.web.resources.static-locations=classpath:/static/,classpath:/public/
spring.web.resources.static-locations=classpath:/static/,classpath:/public/,file:./uploads/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
