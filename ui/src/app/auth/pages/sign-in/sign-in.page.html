<section class="auth-page">
  <div class="auth-layout">
    <div class="auth-visual login-visual">
      <p class="eyebrow light">WELCOME BACK</p>
      <h1>Pick up where you left off.</h1>
      <p>
        Sign in to manage pickups, follow progress, and keep your ScrapFlow
        workspace organized.
      </p>
    </div>

    <div class="auth-card">
      <p class="eyebrow">SECURE SIGN IN</p>
      <h2>Welcome back</h2>
      <p class="subcopy">Your role decides which workspace opens next.</p>

      <div class="alert error" *ngIf="error">{{ error }}</div>

      <form (ngSubmit)="submit(form)" #form="ngForm" novalidate>
        <label>
          Email address
          <input
            name="email"
            type="email"
            [(ngModel)]="email"
            required
            email
            autocomplete="email"
            placeholder="you@example.com"
          />
        </label>

        <label>
          Password
          <div class="password-wrap">
            <input
              name="password"
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="password"
              required
              minlength="8"
              autocomplete="current-password"
              placeholder="Your password"
            />
            <button class="password-toggle" type="button" (click)="showPassword = !showPassword" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'" [title]="showPassword ? 'Hide password' : 'Show password'">
              <svg *ngIf="!showPassword" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
              <svg *ngIf="showPassword" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 6.2A10.7 10.7 0 0 1 12 6c6 0 9.5 6 9.5 6a17 17 0 0 1-3.1 3.8M6.2 6.8C3.8 8.2 2.5 12 2.5 12s3.5 6 9.5 6c1.4 0 2.7-.3 3.8-.8"/></svg>
            </button>
          </div>
        </label>

        <button class="primary-button full" [disabled]="busy || form.invalid">
          {{ busy ? "Signing in..." : "Sign in securely" }}
        </button>
      </form>

      <div class="auth-footer">
        <a class="forgot-link" routerLink="/forgot-password">Forgot Password?</a>
        <a class="back-link" routerLink="/">← Back home</a>
      </div>
    </div>
  </div>
</section>
