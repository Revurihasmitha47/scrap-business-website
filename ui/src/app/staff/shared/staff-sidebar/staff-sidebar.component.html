<aside class="staff-sidebar">
  <a class="staff-brand" routerLink="/staff/my-pickups">
    <span class="staff-brand-mark">♻</span>
    <strong
      >Scrap<span>Flow</span
      ><small>Clean Today<br />Greener Tomorrow</small></strong
    >
  </a>

  <nav aria-label="Staff navigation">
    <a
      routerLink="/staff/my-pickups"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <span class="staff-nav-icon"
        ><svg viewBox="0 0 24 24"><path [attr.d]="iconPath('pickups')" /></svg
      ></span>
      <span>My Pickups</span>
    </a>
    <a routerLink="/staff/map" routerLinkActive="active">
      <span class="staff-nav-icon"
        ><svg viewBox="0 0 24 24"><path [attr.d]="iconPath('map')" /></svg
      ></span>
      <span>Map</span>
    </a>
    <a routerLink="/staff/history" routerLinkActive="active">
      <span class="staff-nav-icon"
        ><svg viewBox="0 0 24 24"><path [attr.d]="iconPath('history')" /></svg
      ></span>
      <span>History</span>
    </a>
    <a routerLink="/staff/notifications" routerLinkActive="active">
      <span class="staff-nav-icon"
        ><svg viewBox="0 0 24 24">
          <path [attr.d]="iconPath('notifications')" /></svg
      ></span>
      <span>Notifications</span>
    </a>
    <a routerLink="/staff/profile" routerLinkActive="active">
      <span class="staff-nav-icon"
        ><svg viewBox="0 0 24 24"><path [attr.d]="iconPath('profile')" /></svg
      ></span>
      <span>Profile</span>
    </a>
  </nav>

  <button class="staff-logout" type="button" (click)="logout()">
    <span class="staff-nav-icon"
      ><svg viewBox="0 0 24 24"><path [attr.d]="iconPath('logout')" /></svg
    ></span>
    <span>Logout</span>
  </button>
</aside>
