<header class="seller-header">
  <a *ngIf="backLink" class="seller-header-back" [routerLink]="backLink">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M19 12H5m7 7-7-7 7-7" />
    </svg>
    <span>Back to My Requests</span>
  </a>

  <div class="seller-header-user">
    <button
      class="seller-notification-button"
      type="button"
      aria-label="Notifications"
      (click)="goToNotifications()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Zm-8 12h4" />
      </svg>
      <i></i>
    </button>

    <button
      class="seller-profile-trigger"
      type="button"
      aria-haspopup="menu"
      [attr.aria-expanded]="profileMenu"
      (click)="profileMenu = !profileMenu"
    >
      <span class="seller-avatar">{{ initials }}</span>
      <strong>{{ auth.session?.fullName || sellerLabel }}</strong>
      <small>{{ sellerLabel }}</small>
      <svg
        class="seller-profile-chevron"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path d="m7 10 5 5 5-5" />
      </svg>
    </button>

    <div class="seller-profile-menu" *ngIf="profileMenu" role="menu">
      <button type="button" (click)="goToProfile()">Profile</button>
      <button type="button" (click)="logout()">Logout</button>
    </div>
  </div>
</header>
